name: Onyx DevOps AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov radon

    - name: Ejecutar Pruebas Automatizadas y Cobertura
      run: |
        pytest --cov=app --cov-report=json:coverage.json tests/

    - name: Análisis de Complejidad Ciclomática con Radon
      run: |
        radon cc app/ -a -json > cc_report.json

    - name: Ejecución del Evaluación con Agente IA
      run: |
        python scripts/ai_metrics_eval.py

    - name: Construcción de Imagen Docker
      run: |
        docker build -t onyx-devops-api:${{ github.sha }} .

    - name: Mostrar Salida de Métricas y Artefactos
      run: |
        cat ai_quality_summary.json